name: Generate Layisi static pages and sitemap

on:
  workflow_dispatch:

  schedule:
    - cron: "17 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: layisi-seo-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate static listing pages and sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Commit generated pages
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Generate Layisi static listing pages and sitemap"
          git push
